[project]
name = "pixcake-agent"
version = "0.1.0"
description = "PixCake's optional local natural-language editing sidecar"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-deepseek>=0.1.0",
    "pydantic>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.14,<0.5.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]
