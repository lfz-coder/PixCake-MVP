[project]
name = "pixcake-cloud-backend"
version = "0.1.0"
description = "Independent PixCake cloud directory API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "itsdangerous==2.2.0",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
